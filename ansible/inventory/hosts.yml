---
# ansible/inventory/hosts.yml
# Static inventory for the two-host setup.
#
#   homelab  — management host running the GitHub Actions runner (10.10.10.20)
#   nas      — deploy target, Docker Compose host (10.10.10.21 = runner IP + 1)
#
# Both hosts are on the same LAN subnet. Update IPs if your network differs.

all:
  vars:
    ansible_user: root
    ansible_python_interpreter: auto_silent

  children:
    runners:
      hosts:
        homelab:
          ansible_host: 10.10.10.20
          ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"

    nas_hosts:
      hosts:
        nas:
          ansible_host: 10.10.10.21
          ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"

    # Every host in the deployment
    all_hosts:
      children:
        runners:
        nas_hosts: