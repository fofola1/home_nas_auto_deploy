###############################################################################
# .github/workflows/ci.yml
# Validation pipeline. Runs on every push/PR on the self-hosted runner.
#   - shell lint on scripts/*
#   - docker compose config for every stack (media, backup, monitoring)
#   - ansible-playbook --syntax-check on all playbooks
###############################################################################

name: "CI"

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STACKS_DIR: "./docker"

jobs:

  shell-lint:
    name: "Shell lint"
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Shellcheck scripts"
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh
          else
            echo "::warning::shellcheck not installed on runner, skipping"
          fi

  compose-config:
    name: "Docker compose config"
    runs-on: self-hosted
    timeout-minutes: 10

    strategy:
      matrix:
        stack: [media, backup, monitoring, photos]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Validate compose file"
        working-directory: ${{ env.STACKS_DIR }}
        run: |
          echo "==> Validating ${{ matrix.stack }}"
          docker compose -f ${{ matrix.stack }}/docker-compose.yml config --quiet
        env:
          # Dummy values so ${VAR} interpolation does not produce empty specs.
          TZ: Europe/Prague
          PUID: "1000"
          PGID: "1000"
          MEDIA_ROOT: /srv/media
          MOVIES_DIR: /srv/media/movies
          TV_DIR: /srv/media/tv
          MUSIC_DIR: /srv/media/music
          BACKUP_ROOT: /srv/backups
          BORG_REPO: ssh://borg@nas/./repo
          BORG_PASSPHRASE: dummy
          PHOTOS_ROOT: /srv/photos
          UPLOAD_LOCATION: /srv/photos/immich
          DB_DATA_LOCATION: /srv/photos/postgres
          DB_PASSWORD: dummy
          PROMETHEUS_RETENTION: 30d
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: dummy

  ansible-check:
    name: "Ansible syntax check"
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install ansible-core"
        run: |
          pip3 install --quiet ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: "Syntax check playbooks"
        working-directory: ansible
        run: |
          ansible-playbook playbooks/site.yml \
            --syntax-check \
            --inventory inventory/hosts.yml